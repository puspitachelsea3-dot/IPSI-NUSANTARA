<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPSI Nusantara</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* =========================
           ANIMASI
        ========================= */

        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(35px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================
           HOME
        ========================= */

        .home {
            width: 100%;
            height: 100vh;

            background-image:
                linear-gradient(
                   rgba(0, 40, 20, 0.45),
                   rgba(0, 40, 20, 0.45)
                ),
                url("WhatsApp\ Image\ 2026-10-03\ at\ 11.50.30.jpeg");

            background-size: cover;
            background-position: center;

            position: relative;
        }

        /* =========================
           NAVBAR
        ========================= */

        nav {
            position: absolute;

            top: 7%;
            left: 6%;
            right: 6%;

            height: 48px;

            background: #1d304c;

            border-radius: 30px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 25px;

            animation: fadeDown 1s ease forwards;
        }

        .logo {
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        nav ul {
            display: flex;
            gap: 30px;
            list-style: none;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;

            transition: 0.3s;
        }

        nav ul li a:hover {
            opacity: 0.7;
        }

        /* =========================
           CONTENT
        ========================= */

        .content {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            text-align: center;

            width: 80%;
        }

        .title {
            font-size: 50px;
            font-weight: 800;
            color: rgb(248, 243, 243);

            animation: fadeUp 1s ease 0.2s both;
        }

        .subtitle {
            display: inline-block;

            margin-top: 18px;

            padding: 10px 25px;

            background: white;

            border-radius: 30px;

            font-size: 18px;
            font-weight: 600;

            animation: fadeUp 1s ease 0.4s both;
        }

        .description {
            color: rgb(255, 252, 252);

            font-size: 17px;
            line-height: 1.5;

            max-width: 650px;

            margin: 18px auto;

            animation: fadeUp 1s ease 0.6s both;
        }

        .explore {
            display: inline-block;

            margin-top: 10px;

            padding: 12px 28px;

            background: #4e9b55;

            color: white;

            text-decoration: none;

            border-radius: 25px;

            font-size: 16px;
            font-weight: bold;

            animation: fadeUp 1s ease 0.8s both;

            transition: 0.3s;
        }

        .explore:hover {
            transform: scale(1.05);
        }

    </style>
</head>

<body>

<div class="home">

    <nav>

        <div class="logo">
            🥋 IPSI NUSANTARA
        </div>

        <ul>
            <li><a href="index.html">HOME</a></li>
            <li><a href="about.html">ABOUT</a></li>
            <li><a href="prestasi.html">PRESTASI</a></li>
            <li><a href="galeri.html">GALERI</a></li>
        </ul>

    </nav>


    <div class="content">

        <h1 class="title">
            IPSI NUSANTARA
        </h1>

        <div class="subtitle">
            Melestarikan Budaya, Mengembangkan Prestasi
        </div>

        <p class="description">
            Mengenal pencak silat Indonesia sebagai warisan budaya,
            olahraga, dan wadah untuk mengembangkan prestasi.
        </p>

        <a href="about.html" class="explore">
            EXPLORE →
        </a>

    </div>

</div>

</body>
</html>
